name: Automated Urdu Video Generator

on:
  schedule:
    - cron: '0 4,10,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python Libraries
        run: |
          pip install --no-cache-dir edge-tts requests pillow

      - name: Run Video Generator Employee
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Save Used Topics Memory
        run: |
          git config --global user.name "Video Employee Bot"
          git config --global user.email "bot@github.com"
          git add used_topics.json || true
          git diff --staged --quiet || git commit -m "Remember used video topic"
          git push || true
