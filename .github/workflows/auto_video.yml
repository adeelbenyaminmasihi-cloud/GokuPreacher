name: 5-Min Infinite Science Documentary Bot

on:
  schedule:
    - cron: '0 */8 * * *'   # Runs every 8 hours automatically
  workflow_dispatch:        # Allows manual 1-click trigger

permissions:
  contents: write           # Required so the bot can save used_topics.json back to the repo

jobs:
  build-and-publish-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu-extra

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install requests edge-tts Pillow

      - name: Generate & Publish 5-Minute Documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python main.py

      - name: Save Used Topics History to Repository (Prevent Repeats Forever)
        run: |
          if [ -f used_topics.json ]; then
            git config --global user.name "Documentary-Bot"
            git config --global user.email "bot@users.noreply.github.com"
            git add used_topics.json
            git diff --staged --quiet || git commit -m "chore: update used_topics.json history [skip ci]"
            git push
          fi

      - name: Upload Final Video Artifact Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-documentary-reel
          path: final_reel.mp4
          if-no-files-found: ignore
          retention-days: 3
